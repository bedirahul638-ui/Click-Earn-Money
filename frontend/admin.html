<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bronze Miner - Secure Admin Panel</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card: #161920;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #f59e0b;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .login-box, .dashboard-container { width: 100%; max-width: 1000px; }
    .login-card { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; margin: 80px auto; display: flex; flex-direction: column; gap: 14px; }
    
    input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #20242f; color: white; font-size: 1rem; }
    button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; text-align: center; }
    .stat-card h3 { font-size: 1.8rem; color: var(--primary); margin-top: 5px; }
    
    .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    th { background: #20242f; color: var(--primary); }
    tr:hover { background: rgba(255,255,255,0.02); }
  </style>
</head>
<body>

  <!-- ADMIN LOGIN BOX -->
  <div id="loginSection" class="login-box">
    <div class="login-card">
      <h2 style="color: var(--primary);">🔒 Admin Login</h2>
      <p style="font-size: 0.85rem; color: var(--text-dim);">Enter secret password to access dashboard.</p>
      <input type="password" id="adminSecretInput" placeholder="Admin Secret Password">
      <button onclick="fetchAdminData()">Login to Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD DATA SECTION -->
  <div id="dashboardSection" class="dashboard-container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>⚡ Bronze Miner - Live Admin Panel</h2>
      <button onclick="location.reload()" style="width: auto; padding: 8px 16px;">Logout 🚪</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <p style="color:var(--text-dim)">Total Registered Users</p>
        <h3 id="totalUsersCount">0</h3>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email / Phone</th>
            <th>Coins</th>
            <th>Total Taps</th>
            <th>Energy</th>
            <th>UPI ID</th>
            <th>Joined Date</th>
          </tr>
        <tbody id="userTableBody">
          <!-- User rows will load here dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://click-earn-money.onrender.com";

    async function fetchAdminData() {
      const secret = document.getElementById('adminSecretInput').value.trim();
      if (!secret) {
        alert("Please enter password!");
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/dashboard?secret=${secret}`);
        const data = await res.json();

        if (data.success) {
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('dashboardSection').style.display = 'block';

          document.getElementById('totalUsersCount').innerText = data.totalUsers;

          const tbody = document.getElementById('userTableBody');
          tbody.innerHTML = "";

          data.users.forEach(user => {
            const tr = document.createElement('tr');
            const joinedDate = new Date(user.createdAt).toLocaleDateString();
            
            tr.innerHTML = `
              <td><b>${user.name || 'N/A'}</b></td>
              <td>${user.email}<br><span style="color:var(--text-dim);font-size:0.75rem;">${user.phone || ''}</span></td>
              <td style="color: var(--primary); font-weight: bold;">🪙 ${Math.floor(user.coins || 0)}</td>
              <td>${user.totalTaps || 0}</td>
              <td>${user.energy || 100}/${user.maxEnergy || 100}</td>
              <td>${user.upi || '<span style="color:red">Not Added</span>'}</td>
              <td style="font-size:0.78rem; color:var(--text-dim);">${joinedDate}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          alert(data.error || "Incorrect Password!");
        }
      } catch (err) {
        alert("Connection error: " + err.message);
      }
    }
  </script>
</body>
</html>
